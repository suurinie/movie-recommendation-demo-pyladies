[project]
name = "movie-demo"
version = "0.1.0"
description = "Synthetic movie preferences and a sparse linear recommendation demo"
readme = "README.md"
authors = [
    { name = "Saku Suuriniemi", email = "saku.suuriniemi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "streamlit>=1.66.0",
]

[project.scripts]
movie-demo = "movie_demo:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "scikit-learn-stubs>=0.0.3",
    "scipy-stubs>=1.18.1.1",
    "ty>=0.0.98",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
